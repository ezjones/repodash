id = "repodash"
name = "RepoDash"
version = "0.7.5"
min_herdr_version = "0.9.0"
description = "Live dashboard of all your git repos at a glance: git status, AI agents and GitHub issues. Jump into any repo's workspace."
platforms = ["linux", "macos"]

# herdr resolves "./" programs against the plugin root.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/herdr-build.sh"]

[[actions]]
id = "open"
title = "Open RepoDash"
description = "Show the repo grid in its own tab (reuses it if already open)"
contexts = ["global"]
command = ["./repodash", "-herdr-open"]

# A tab, not a popup: a herdr popup takes all input until it closes.
[[panes]]
id = "grid"
title = "RepoDash"
description = "Repo status cards; Enter jumps to the repo's workspace"
placement = "tab"
command = ["./repodash", "-tui"]
